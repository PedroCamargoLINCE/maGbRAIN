# Uso: docker compose up site rag        -> mapa em :8080, perguntas em :8081
#      docker compose --profile llm up   -> também sobe um modelo local gratuito (Ollama)
# A pasta do repositório é montada, então ideias novas aparecem ao reiniciar o site;
# o RAG relê os arquivos a cada pergunta.
services:
  site:
    build: .
    command: site
    ports: ["8080:8080"]
    volumes: [".:/magbrain"]
  rag:
    build: .
    command: rag
    ports: ["8081:8081"]
    volumes: [".:/magbrain:ro"]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
  ollama:
    image: ollama/ollama:0.6.5
    profiles: ["llm"]
    volumes: ["ollama:/root/.ollama"]
volumes:
  ollama:
